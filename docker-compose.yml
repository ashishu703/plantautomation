services:
  postgres:
    image: postgres:16-alpine
    container_name: plant-pnl-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plant_pnl
    volumes:
      - plant_pnl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plant_pnl"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  plant_pnl_pgdata:
